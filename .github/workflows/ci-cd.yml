name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # Lint and type check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [gateway, frontend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}
        
      - name: Run linter
        run: npm run lint
        working-directory: ${{ matrix.project }}
        
      - name: Type check
        run: npm run build
        working-directory: ${{ matrix.project }}

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install ruff mypy
          pip install -r requirements.txt
        working-directory: agents
        
      - name: Run ruff
        run: ruff check .
        working-directory: agents
        
      - name: Run mypy
        run: mypy src --ignore-missing-imports
        working-directory: agents

  # Unit tests
  test-gateway:
    name: Test Gateway
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        working-directory: gateway
        
      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: gateway
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          
      - name: Run tests
        run: npm test -- --coverage
        working-directory: gateway
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: gateway/coverage/lcov.info
          flags: gateway

  test-agents:
    name: Test Agents
    runs-on: ubuntu-latest
    needs: lint-python
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
        working-directory: agents
        
      - name: Run tests
        run: pytest --cov=src --cov-report=xml
        working-directory: agents
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: agents/coverage.xml
          flags: agents

  # OPA policy tests
  test-policies:
    name: Test OPA Policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
          
      - name: Run policy tests
        run: opa test policies/ -v

  # Build and push images
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [test-gateway, test-agents, test-policies]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - project: gateway
            dockerfile: gateway/Dockerfile
            context: gateway
          - project: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
          - project: agents
            dockerfile: agents/Dockerfile
            context: agents
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.project }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Helm
        uses: azure/setup-helm@v3
        
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}
          
      - name: Deploy with Helm
        run: |
          helm upgrade --install enterprise-crm ./deploy/helm/enterprise-crm \
            --namespace crm-staging \
            --create-namespace \
            --values ./deploy/helm/enterprise-crm/values-staging.yaml \
            --set images.gateway.tag=${{ github.sha }} \
            --set images.frontend.tag=${{ github.sha }} \
            --set images.agents.tag=${{ github.sha }} \
            --wait --timeout 10m

  # Integration tests on staging
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install test dependencies
        run: npm ci
        working-directory: tests/integration
        
      - name: Run integration tests
        run: npm test
        working-directory: tests/integration
        env:
          API_URL: ${{ secrets.STAGING_API_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

  # Deploy to production (manual approval required)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: integration-tests
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Helm
        uses: azure/setup-helm@v3
        
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
          
      - name: Deploy with Helm
        run: |
          helm upgrade --install enterprise-crm ./deploy/helm/enterprise-crm \
            --namespace crm-production \
            --create-namespace \
            --values ./deploy/helm/enterprise-crm/values-production.yaml \
            --set images.gateway.tag=${{ github.sha }} \
            --set images.frontend.tag=${{ github.sha }} \
            --set images.agents.tag=${{ github.sha }} \
            --wait --timeout 15m
            
      - name: Notify deployment
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚀 Enterprise CRM deployed to production",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Enterprise CRM* deployed to production\nCommit: `${{ github.sha }}`\nBy: ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
