version: "3.8"

services:
  # ===================
  # Frontend
  # ===================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:4000}
    depends_on:
      - gateway
    networks:
      - crm-network

  # ===================
  # API Gateway
  # ===================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - KAFKA_BROKERS=kafka:9092
      - OPA_URL=${OPA_URL}
      - JWT_SECRET=${JWT_SECRET}
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - REPLAY_SERVICE_URL=${REPLAY_SERVICE_URL:-http://replay-service:5011}
    depends_on:
      - postgres
      - redis
      - kafka
      - opa
    networks:
      - crm-network

  # ===================
  # Core Services
  # ===================
  leads-service:
    build:
      context: ./services/leads
      dockerfile: Dockerfile
    ports:
      - "${LEADS_SERVICE_PORT:-5001}:5001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - KAFKA_BROKERS=kafka:9092
      - OPA_URL=${OPA_URL}
    depends_on:
      - postgres
      - kafka
    networks:
      - crm-network

  deals-service:
    build:
      context: ./services/deals
      dockerfile: Dockerfile
    ports:
      - "${DEALS_SERVICE_PORT:-5002}:5002"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - KAFKA_BROKERS=kafka:9092
      - OPA_URL=${OPA_URL}
    depends_on:
      - postgres
      - kafka
    networks:
      - crm-network

  tickets-service:
    build:
      context: ./services/tickets
      dockerfile: Dockerfile
    ports:
      - "${TICKETS_SERVICE_PORT:-5003}:5003"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - KAFKA_BROKERS=kafka:9092
      - OPA_URL=${OPA_URL}
    depends_on:
      - postgres
      - kafka
    networks:
      - crm-network

  customers-service:
    build:
      context: ./services/customers
      dockerfile: Dockerfile
    ports:
      - "${CUSTOMERS_SERVICE_PORT:-5004}:5004"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - KAFKA_BROKERS=kafka:9092
      - OPA_URL=${OPA_URL}
    depends_on:
      - postgres
      - kafka
    networks:
      - crm-network

  # ===================
  # AI Agents
  # ===================
  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    ports:
      - "${AGENTS_PORT:-5010}:5010"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - OLLAMA_URL=${OLLAMA_URL}
      - WEAVIATE_URL=${WEAVIATE_URL}
      - OPA_URL=${OPA_URL}
    depends_on:
      - kafka
      - ollama
      - weaviate
    networks:
      - crm-network

  replay-service:
    build:
      context: ./agents
      dockerfile: Dockerfile
    command: ["uvicorn", "replay.api:app", "--host", "0.0.0.0", "--port", "5011"]
    ports:
      - "${REPLAY_SERVICE_PORT:-5011}:5011"
    environment:
      - DATABASE_URL=${REPLAY_DATABASE_URL:-postgresql://crm_app:crm_password@postgres:5432/enterprise_crm}
      - KAFKA_BROKERS=kafka:9092
      - ENABLE_REPLAY_INGESTOR=${ENABLE_REPLAY_INGESTOR:-true}
      - REPLAY_INGESTOR_GROUP=${REPLAY_INGESTOR_GROUP:-replay-event-ingestor}
    depends_on:
      - postgres
      - kafka
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:5011/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================
  # Infrastructure
  # ===================
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-crm_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-crm_password}
      - POSTGRES_DB=${POSTGRES_DB:-enterprise_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - crm-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-crm_user} -d ${POSTGRES_DB:-enterprise_crm}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-crm_user}:${POSTGRES_PASSWORD:-crm_password}@postgres:5432/${POSTGRES_DB:-enterprise_crm}?sslmode=disable
    depends_on:
      - postgres
    networks:
      - crm-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    networks:
      - crm-network

  # Kafka with KRaft (no Zookeeper)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - crm-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command:
      - "--kafka.server=kafka:9092"
    depends_on:
      - kafka
    networks:
      - crm-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=enterprise-crm
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - crm-network

  # ===================
  # Policy Engine
  # ===================
  opa:
    image: openpolicyagent/opa:0.55.0
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    volumes:
      - ./policies:/policies
    networks:
      - crm-network

  # ===================
  # AI/LLM
  # ===================
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - crm-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  weaviate:
    image: semitechnologies/weaviate:1.23.0
    ports:
      - "8082:8080"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - CLUSTER_HOSTNAME=node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - crm-network

  # ===================
  # Authentication
  # ===================
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    ports:
      - "8081:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-enterprise_crm}
      - KC_DB_USERNAME=${POSTGRES_USER:-crm_user}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:-crm_password}
    command: start-dev
    depends_on:
      - postgres
    networks:
      - crm-network

  # ===================
  # Observability
  # ===================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    networks:
      - crm-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - crm-network

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  ollama_data:
  weaviate_data:
  prometheus_data:
  grafana_data:
  loki_data:
