# Default values for Enterprise CRM
# Override these for different environments

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  domain: crm.example.com
  
# Namespace
namespace: crm

# Environment
environment: production

# Replica counts
replicaCount:
  frontend: 2
  gateway: 3
  agents: 2

# Images
images:
  frontend:
    repository: enterprise-crm/frontend
    tag: latest
    pullPolicy: IfNotPresent
  gateway:
    repository: enterprise-crm/gateway
    tag: latest
    pullPolicy: IfNotPresent
  agents:
    repository: enterprise-crm/agents
    tag: latest
    pullPolicy: IfNotPresent

# Service configurations
services:
  frontend:
    type: ClusterIP
    port: 3000
  gateway:
    type: ClusterIP
    port: 4000
  agents:
    type: ClusterIP
    port: 5010

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  hosts:
    - host: crm.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: gateway
        - path: /ws
          pathType: Prefix
          service: gateway
  tls:
    - secretName: crm-tls
      hosts:
        - crm.example.com

# Resources
resources:
  frontend:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  gateway:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  agents:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Autoscaling
autoscaling:
  enabled: true
  gateway:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  agents:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

# PostgreSQL
postgresql:
  enabled: true
  auth:
    username: crm_user
    password: ""  # Use secret
    database: enterprise_crm
  primary:
    persistence:
      enabled: true
      size: 50Gi
  readReplicas:
    replicaCount: 2

# Redis
redis:
  enabled: true
  architecture: replication
  auth:
    enabled: true
    password: ""  # Use secret
  master:
    persistence:
      enabled: true
      size: 10Gi
  replica:
    replicaCount: 2

# Kafka
kafka:
  enabled: true
  replicaCount: 3
  persistence:
    enabled: true
    size: 50Gi
  zookeeper:
    replicaCount: 3
    persistence:
      enabled: true
      size: 10Gi

# OPA
opa:
  enabled: true
  replicaCount: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Weaviate
weaviate:
  enabled: true
  replicas: 2
  storage:
    size: 20Gi

# Ollama
ollama:
  enabled: true
  model: llama3.1
  resources:
    limits:
      nvidia.com/gpu: 1
      memory: 16Gi
    requests:
      memory: 8Gi

# Keycloak
keycloak:
  enabled: true
  auth:
    adminUser: admin
    adminPassword: ""  # Use secret
  replicaCount: 2

# Monitoring
monitoring:
  enabled: true
  prometheus:
    enabled: true
    retention: 15d
    storage: 50Gi
  grafana:
    enabled: true
    adminPassword: ""  # Use secret
  loki:
    enabled: true
    retention: 7d

# Secrets (reference existing K8s secrets)
secrets:
  postgresql:
    existingSecret: crm-postgresql-secret
    passwordKey: password
  redis:
    existingSecret: crm-redis-secret
    passwordKey: password
  jwt:
    existingSecret: crm-jwt-secret
    secretKey: jwt-secret
  keycloak:
    existingSecret: crm-keycloak-secret
    adminPasswordKey: admin-password

# Pod disruption budgets
podDisruptionBudget:
  gateway:
    minAvailable: 1
  agents:
    minAvailable: 1

# Node selectors
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - gateway
          topologyKey: kubernetes.io/hostname
